name: '🏷️ Sync labels'

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  call:
    permissions:
      # Labels are managed through the issues API.
      issues: write
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/sync-labels.yaml@master
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
