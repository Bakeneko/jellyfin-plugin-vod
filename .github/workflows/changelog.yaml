name: '📝 Create/Update Release Draft & Release Bump PR'

on:
  push:
    branches:
      - main
    paths-ignore:
      - build.yaml
  workflow_dispatch:
  repository_dispatch:
    types:
      - update-prep-command

jobs:
  call:
    permissions:
      # Draft the release, push the version-bump branch and open its pull request.
      contents: write
      pull-requests: write
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/changelog.yaml@master
    with:
      repository-name: bakeneko/jellyfin-plugin-vod
      commiter-name: GitHub Actions
      commiter-email: actions@github.com
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
