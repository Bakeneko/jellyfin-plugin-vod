name: '🚀 Publish Plugin'

# Runs on a published release only: the assets are uploaded to that release, so there is nothing to
# publish to without one.
on:
  release:
    types:
      - released

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Upload the release assets and push the updated manifest.json to main.
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Setup jprm
        run: |
          pip install --user jprm

      - name: Build Jellyfin Plugin
        uses: oddstr13/jellyfin-plugin-repository-manager@9497a0a499416cc572ed2e07a391d9f943a37b4d # v1.1.1
        id: jprm
        with:
          dotnet-target: net10.0
          output: ./artifacts

      - name: Prepare GH Release Assets
        run: |-
          mkdir ./upload
          cp ${{ steps.jprm.outputs.artifact }} ./upload
          for file in ./upload/*; do
            md5sum ${file#./} >> ${file%.*}.md5
            sha256sum ${file#./} >> ${file%.*}.sha256
          done
          ls -l

      - name: Upload GH Release Assets
        id: release
        uses: shogo82148/actions-upload-release-asset@8482bd769644976d847e96fb4b9354228885e7b4 # v1.7.8
        with:
          upload_url: ${{ github.event.release.upload_url }}
          overwrite: true
          asset_path: ./upload/*

      - name: Update manifest
        run: |
          jprm repo add --plugin-url $(echo "${{ steps.release.outputs.browser_download_url }}" | sed -n 3p) ./manifest.json ./upload/*.zip

      # A plain push: if main moved while this ran, failing loudly beats overwriting what landed.
      - name: Commit manifest
        run: |
          git config user.name "GitHub Actions"
          git config user.email actions@github.com
          git pull --ff-only
          git add ./manifest.json
          git commit -m "chore(release): update manifest.json"
          git push origin main
